name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.dvc/config'
      - '.github/workflows/**.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa-key.json" >> $GITHUB_ENV

      # --- Bonus 1: DagsHub MLflow tracking ---
      - name: Configure MLflow tracking (DagsHub)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=$MLFLOW_TRACKING_USERNAME" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=$MLFLOW_TRACKING_PASSWORD" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          from google.cloud import storage
          import os
          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("models/latest/model.pkl")
          blob.upload_from_filename("models/model.pkl")
          print(f"Model da duoc upload len gs://{bucket_name}/models/latest/model.pkl")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

      # --- Bonus 3: Upload report artifact ---
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.txt

      # --- Bonus 4: Save metrics to GCS for rollback comparison ---
      - name: Upload metrics to Cloud Storage (for rollback)
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          from google.cloud import storage
          import os
          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("models/latest/metrics.json")
          blob.upload_from_filename("outputs/metrics.json")
          print(f"Metrics da duoc upload len gs://{bucket_name}/models/latest/metrics.json")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= 0.70. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY (voi Bonus 4: rollback check)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      # --- Bonus 4: Compare old vs new accuracy ---
      - name: Check previous accuracy for rollback
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
          NEW_ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          echo "new_accuracy=$NEW_ACCURACY" >> $GITHUB_ENV

          python - <<'ENDPY'
          import os, json
          try:
              from google.cloud import storage
              bucket = storage.Client().bucket(os.environ["CLOUD_BUCKET"])
              blob = bucket.blob("models/latest/metrics.json")
              if blob.exists():
                  old_metrics = json.loads(blob.download_as_text())
                  old_acc = old_metrics["accuracy"]
                  new_acc = float(os.environ["NEW_ACCURACY"])
                  print(f"Old accuracy: {old_acc:.4f} | New accuracy: {new_acc:.4f}")
                  if new_acc < old_acc:
                      raise SystemExit(
                          f"ROLLBACK: new accuracy {new_acc:.4f} < old accuracy {old_acc:.4f}. Huy deploy."
                      )
                  print(f"PASSED: new accuracy {new_acc:.4f} >= old accuracy {old_acc:.4f}. Tiep tuc deploy.")
              else:
                  print("No previous metrics found. Skipping rollback check.")
          except SystemExit:
              raise
          except Exception as e:
              print(f"Could not check previous metrics: {e}. Skipping rollback check.")
          ENDPY

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            for i in 1 2 3 4 5; do
              curl -sf http://localhost:8000/health && echo "Health check passed." && exit 0
              echo "Thu lan $i that bai, cho 5s..."
              sleep 5
            done
            echo "Health check failed sau 5 lan thu." && exit 1
